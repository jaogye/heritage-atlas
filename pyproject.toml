[project]
name = "heritage-atlas"
version = "0.2.0"
description = "A multimodal (image + text) embedding space over an integrated cultural-heritage dataset, with clustering and relationship mining."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Juan Alvarado" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
    "pillow>=10",
    "scikit-learn>=1.3",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
models = [
    "torch>=2.2",
    "open_clip_torch>=2.24",
    "sentence-transformers>=3.0",
]
extras = ["umap-learn>=0.5", "faiss-cpu>=1.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
atlas = "atlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
